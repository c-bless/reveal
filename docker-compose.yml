services:
  webapp:
    build: ./services/web
    # --no-control-socket: the control interface of gunicorn >= 26 is not used (its default location $HOME/.gunicorn
    # is not writable, the container runs as non-root)
    command: gunicorn --bind 0.0.0.0:8000 --workers=2 --timeout=500 --no-control-socket reveal.app:app
    volumes:
      - ./services/web/:/app
      - upload_volume:/app/uploads/
      - report_volume:/app/reports/
    env_file:
      - ./services/web/webapp.env
    depends_on:
      - db
  webapi:
    build: ./services/api
    command: gunicorn --bind 0.0.0.0:8001 --no-control-socket reveal.api:app
    volumes:
      - ./services/api/:/app
    env_file:
      - ./services/web/webapp.env
    depends_on:
      - db
      - webapp
  db:
    build: ./services/db
    volumes:
      # PostgreSQL 18+ stores the data below /var/lib/postgresql/<major version>/docker
      - postgres_data:/var/lib/postgresql
  nginx:
    build: ./services/nginx
    # nginx runs as non-root and listens on unprivileged ports: 8080 (http), 4443 (webapp), 8443 (webapi)
    ports:
      - "80:8080"
      - "81:81"
      - "443:4443"
      - "8443:8443"
    depends_on:
      - webapp
      - webapi
volumes:
  postgres_data:
  upload_volume:
  report_volume:
  ssl_volume:
