meta:
  name: "Defender Tests"
  version: 0.1
  description: "Checks config for specified defender settings."
  reference: ""


system:


  Defender:
    # --- Status (Get-MpComputerStatus): <field>: expected value ---
    AMServiceEnabled: True
    AntivirusEnabled: True
    AntispywareEnabled: True
    RealTimeProtectionEnabled: True
    BehaviorMonitorEnabled: True
    IoavProtectionEnabled: True
    OnAccessProtectionEnabled: True
    NISEnabled: True

    # --- Settings (Get-MpPreference): <field>: expected value ---
    DisableRealtimeMonitoring: False
    DisableBehaviorMonitoring: False
    DisableIOAVProtection: False
    DisableIntrusionPreventionSystem: False
    DisableScriptScanning: False
    DisableBlockAtFirstSeen: False
    DisableArchiveScanning: False
    DisableRemovableDriveScanning: False
    # network protection: 0 = disabled, 1 = enabled (block mode), 2 = audit mode - single value or list, e.g. [1, 2]
    EnableNetworkProtection: 1
    # Defender defaults are True for the following settings - enable only if required by the hardening guide
    # DisableEmailScanning: False
    # DisableScanningMappedNetworkDrivesForFullScan: False
    # DisableCatchupQuickScan: False

    # --- Exclusions (ExclusionPath / ExclusionProcess) ---
    # Exclusions are stored as one string, the patterns are matched as case-insensitive substrings.
    # Use single quotes, so backslashes are not treated as escape characters.

    # no exclusions configured at all
    ExclusionPathNotSet: True
    # ExclusionProcessNotSet: True

    # exclusions that must not be configured (e.g. user-writable directories, script interpreters)
    ExclusionPathNotContains:
      - '\Temp'
      - '\Users\'
      - '\Downloads'
      - '\ProgramData'
      - '*'
    ExclusionProcessNotContains:
      - 'powershell.exe'
      - 'pwsh.exe'
      - 'cmd.exe'
      - 'wscript.exe'
      - 'cscript.exe'
      - 'mshta.exe'
      - 'rundll32.exe'
      - 'regsvr32.exe'

    # exclusions that must be configured (e.g. required by a vendor)
    # ExclusionPathContains:
    #   - 'C:\path'
    
  firewall_checks:
    # public, domain, private
    enabled_profiles: [ 'public', 'domain', 'private' ]
    disabled_profiles: [ ]

  SMB:
    v1_enabled: False
    signing_enabled: True
    signing_required: True

  TLS:
    ssl2_0_Client: Disabled
    ssl2_0_Server: Disabled
    ssl3_0_Client: Disabled
    ssl3_0_Server: Disabled
    tls1_0_Client: Disabled
    tls1_0_Server: Disabled
    tls1_1_Client: Disabled
    tls1_1_Server: Disabled
    tls1_2_Client: Enabled
    tls1_2_Server: Enabled

  configcheck_results:
    - name: "SSL 2.0 - disabled (Client)"
      result: Disabled
    - name: "SSL 2.0 - disabled (Server)"
      result: Disabled
    - name: "SSL 3.0 - disabled (Client)"
      result: Disabled
    - name: "SSL 3.0 - disabled (Server)"
      result: Disabled
    - name: "TLS 1.0 - disabled (Client)"
      result: Disabled
    - name: "TLS 1.0 - disabled (Server)"
      result: Disabled
    - name: "TLS 1.1 - disabled (Client)"
      result: Disabled
    - name: "TLS 1.1 - disabled (Server)"
      result: Disabled
    - name: "TLS 1.2 - disabled (Client)"
      result: Enabled
    - name: "TLS 1.2 - disabled (Server)"
      result: Enabled
    - name: "LLMNR - Enabled"
      result: "Disabled"

  wsus:
    https_enabled: True
    WUServer: "https://domain.local:8531"
    WUStatusServer: "https://domain.local:8531"
    DisableWindowsUpdateAccess : True
    ElevateNonAdmins: False 
    TargetGroup : "GROUPNAME"
    TargetGroupEnabled: True

  llmnr:
    Status: Disabled 

  