# Builds the Docker images (webapp, webapi, nginx, db) to check that the build works.
# Nothing is pushed to a registry.
#
# The build uses the same steps as a local "make build": the static frontend dependencies are downloaded
# (download-dependencies.sh), the data directories and the source code are copied to services/*, and the images are
# built with docker compose.
name: Docker build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch / pull request cancels the running build
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # image names (reveal-webapp, ...) independent of the checkout directory (repository name)
      COMPOSE_PROJECT_NAME: reveal

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build images (make build)
        run: make build

      - name: Check images
        run: |
          set -euo pipefail
          for image in reveal-webapp reveal-webapi; do
            echo "[*] ${image}: dependencies and imports"
            docker run --rm -e DATABASE_URL=sqlite:////tmp/check.sqlite "${image}" \
              sh -c 'pip check && python -c "import reveal.app, reveal.api"'
          done
          echo "[*] reveal-nginx: configuration"
          docker run --rm --add-host webapp:127.0.0.1 --add-host webapi:127.0.0.1 reveal-nginx nginx -t
          echo "[*] reveal-db: version"
          docker run --rm --entrypoint postgres reveal-db --version

      - name: Start environment
        run: |
          set -euo pipefail
          # start the database first: webapp creates the tables on startup and depends_on does not wait until
          # PostgreSQL accepts connections
          docker compose up -d db
          for i in $(seq 1 60); do
            docker compose exec -T db pg_isready -U revealuser -d reveal && break
            sleep 2
          done
          docker compose exec -T db pg_isready -U revealuser -d reveal
          docker compose up -d
          # ready as soon as the login page is served via nginx (HTTPS, self-signed certificate)
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/login || true)
            [ "${code}" = "200" ] && break
            sleep 2
          done
          echo "login page: HTTP ${code}"
          [ "${code}" = "200" ]

      - name: Init database (make init-db)
        run: |
          set -euo pipefail
          make init-db 2>&1 | tee init-db.log

      - name: Check database initialisation
        run: |
          set -euo pipefail
          psql() { docker compose exec -T db psql -U revealuser -d reveal -tAc "$1"; }

          # "user create" does not fail on errors (it only prints a message), so the result is checked in the database
          users=$(psql "SELECT count(*) FROM auth_user WHERE \"Username\" = 'admin'")
          echo "admin users: ${users}"
          [ "${users}" = "1" ]

          expected=$(( $(grep -c . data-directories/update-data/win-support-dates.csv) - 1 ))
          eol=$(psql 'SELECT count(*) FROM "EoL"')
          echo "EoL entries: ${eol} (expected ${expected} from win-support-dates.csv)"
          [ "${eol}" = "${expected}" ]

          # end-to-end: the generated API token of the admin user is accepted by the API (via nginx)
          token=$(sed -n 's/.*API-Token: \([0-9a-f]*\).*/\1/p' init-db.log | head -n 1)
          [ -n "${token}" ]
          code=$(curl -sk -o /dev/null -w '%{http_code}' -H "X-API-KEY: ${token}" https://localhost:8443/api/sysinfo/hosts/)
          echo "API with admin token: HTTP ${code}"
          [ "${code}" = "200" ]

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop environment
        if: always()
        run: docker compose down -v

      - name: List images
        if: always()
        run: docker image ls --filter "reference=reveal-*"
